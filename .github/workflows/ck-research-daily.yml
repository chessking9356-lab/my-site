name: CK Research Daily
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'revision-1000 queues the one-off formal edition until 10:00 Shanghai on 2026-09-25'
        type: choice
        options: [revision-1000, preview-revision, test, dry-run, daily]
        default: test
  push:
    branches: [main]
    paths: ['research_daily/**', '.github/workflows/ck-research-daily.yml']
  schedule:
    # 07:17 Asia/Shanghai; prepare early, then wait until 08:00.
    - cron: '17 23 * * *'
    - cron: '17 1 25 9 *'
permissions:
  contents: write
concurrency:
  group: ck-research-daily
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -s tests -p 'test_ck_daily.py' -v
      - name: Generate and deliver
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          RESEARCH_CONTEXT: ${{ secrets.RESEARCH_CONTEXT }}
          GH_STATE_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" = "17 1 25 9 *" ]; then
            if [ "$(TZ=Asia/Shanghai date +%F)" != "2026-09-25" ]; then
              echo 'One-off revision date has passed; no message sent.'
              exit 0
            fi
            python research_daily/revision_1000.py --send
          elif [ "$EVENT_NAME" = "schedule" ]; then
            python research_daily/daily.py --mode daily --at-eight
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -f research_daily/revision_1000.py ]; then
              python research_daily/revision_1000.py
            else
              echo 'Waiting for revision_1000.py upload; nothing sent.'
            fi
          elif [ "$INPUT_MODE" = "revision-1000" ]; then
            python research_daily/revision_1000.py --send
          elif [ "$INPUT_MODE" = "preview-revision" ]; then
            python research_daily/revision_1000.py
          else
            python research_daily/daily.py --mode "${INPUT_MODE:-test}"
          fi
      - name: Save daily archive for Hub import
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ck-daily-${{ github.run_id }}
          path: work/ck-daily-output/
          retention-days: 90
          if-no-files-found: ignore
